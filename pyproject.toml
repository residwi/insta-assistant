[project]
name = "insta-assistant"
version = "0.2.0"
description = "Detect who unfollowed you on Instagram by diffing your follower list over time."
requires-python = ">=3.14"
dependencies = [
    "instagrapi",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
